<!doctype html>
<html lang="ru" data-theme="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Копилка</title>
    <meta name="description" content="Копилка — цели накоплений, пополнения, прогресс и статистика. Данные хранятся только в вашем браузере." />
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body class="app-body">
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

    <header class="app-header">
      <h1 id="screen-title">Копилка</h1>
      <button class="icon-btn" id="header-action" type="button" aria-label="Новая цель">+</button>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="tabbar" role="tablist" aria-label="Разделы">
      <button class="tab is-active" data-tab="goals" role="tab" aria-selected="true" type="button">
        <span class="tab-icon">◎</span><span>Цели</span>
      </button>
      <button class="tab" data-tab="stats" role="tab" aria-selected="false" type="button">
        <span class="tab-icon">▨</span><span>Статистика</span>
      </button>
      <button class="tab" data-tab="settings" role="tab" aria-selected="false" type="button">
        <span class="tab-icon">⚙</span><span>Настройки</span>
      </button>
    </nav>

    <div id="sheet-root"></div>
    <div id="confetti-root" aria-hidden="true"></div>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
